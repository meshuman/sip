<!doctype html>
<html>
<head><meta name="viewport" content="width=device-width, initial-scale=1"><script>(function(){var m=location.search.match(/theme=(light|dark)/);if(m)document.documentElement.setAttribute("data-theme",m[1]);})();</script><link rel="stylesheet" href="../../tokens.css"><link rel="stylesheet" href="../bundle.css"><meta charset="utf-8"><title>Film frame</title></head>
<body class="sp" style="margin:0;padding:24px">
<section class="sp-film">
  <div class="sp-film__frame">
    <svg viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
      <rect width="1600" height="900" style="fill:var(--lokta-deep)"></rect>
      <circle cx="1060" cy="420" r="300" style="fill:none;stroke:var(--gilt)" stroke-width="2"></circle>
      <path d="M760 900c40-200 160-320 300-320s260 120 300 320Z" style="fill:var(--line)"></path>
      <ellipse cx="1060" cy="420" rx="92" ry="112" style="fill:var(--line)"></ellipse>
      <path d="M0 640h520" style="stroke:var(--stone)" stroke-width="2" opacity=".4"></path>
    </svg>
    <button class="sp-film__play" type="button">
      <svg viewBox="0 0 28 28" aria-hidden="true"><circle cx="14" cy="14" r="13" style="fill:var(--malachite)"></circle><path d="M11.5 9.5 19 14l-7.5 4.5Z" style="fill:var(--on-malachite)"></path></svg>
      Watch the making <span class="sp-reg-s">2:14</span>
    </button>
  </div>
  <ol class="sp-film__chapters">
    <li class="is-now"><b>Wax model</b><span class="sp-reg-s">0:00</span></li>
    <li><b>Clay mould</b><span class="sp-reg-s">0:42</span></li>
    <li><b>Casting</b><span class="sp-reg-s">1:05</span></li>
    <li><b>Chasing</b><span class="sp-reg-s">1:21</span></li>
    <li><b>Fire-gilding</b><span class="sp-reg-s">1:48</span></li>
  </ol>
  <p class="sp-film__credit">Filmed in Nagbahal over 38 days. The full, uncut record (41 min) is on Raju's page.</p>
</section>
</body>
</html>
