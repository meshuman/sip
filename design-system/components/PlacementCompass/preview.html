<!doctype html>
<html>
<head><meta name="viewport" content="width=device-width, initial-scale=1"><script>(function(){var m=location.search.match(/theme=(light|dark)/);if(m)document.documentElement.setAttribute("data-theme",m[1]);})();</script><link rel="stylesheet" href="../../tokens.css"><link rel="stylesheet" href="../bundle.css"><meta charset="utf-8"><title>Placement compass</title></head>
<body class="sp" style="margin:0;padding:24px">
<div class="sp-compass">
  <svg viewBox="0 0 160 160" role="img" aria-label="The statue faces east">
    <circle class="ring" cx="80" cy="80" r="62"></circle>
    <circle class="ring" cx="80" cy="80" r="40"></circle>
    <line class="tick" x1="80" y1="14" x2="80" y2="24"></line>
    <line class="tick" x1="80" y1="136" x2="80" y2="146"></line>
    <line class="tick" x1="14" y1="80" x2="24" y2="80"></line>
    <line class="tick" x1="136" y1="80" x2="146" y2="80"></line>
    <text class="dir" x="80" y="10" text-anchor="middle">N</text>
    <text class="dir" x="80" y="158" text-anchor="middle">S</text>
    <text class="dir" x="6" y="84" text-anchor="middle">W</text>
    <text class="dir dir--on" x="155" y="84" text-anchor="middle">E</text>
    <rect class="piece" x="72" y="72" width="16" height="16"></rect>
    <path class="arrow" d="M92 76 L120 80 L92 84 Z"></path>
  </svg>
  <div class="sp-compass__body">
    <p class="sp-label" style="margin:0 0 4px">Where to place it</p>
    <ul>
      <li><span class="sp-label">Facing</span><span>East, toward the morning light</span></li>
      <li><span class="sp-label">Height</span><span>At or above eye level, on a shelf or altar</span></li>
      <li><span class="sp-label">Room</span><span>A clean, quiet room. Not a bathroom or below stairs</span></li>
    </ul>
    <small>These are customary in Nepali Buddhist homes. Follow your own tradition where it differs.</small>
  </div>
</div>
</body>
</html>
