<!-- Sīpa design system · ShareBar preview. Open in a browser. -->
<!doctype html>
<html>
<head><meta name="viewport" content="width=device-width, initial-scale=1"><script>(function(){var m=location.search.match(/theme=(light|dark)/);if(m)document.documentElement.setAttribute("data-theme",m[1]);})();</script><link rel="stylesheet" href="../../tokens.css"><link rel="stylesheet" href="../bundle.css"><meta charset="utf-8"><title>Share bar</title></head>
<body class="sp" style="margin:0;padding:24px">
<p class="sp-label" style="margin:0 0 12px">Share this piece</p>
<div class="sp-sharebar">
  <button class="sp-sharebar__btn" type="button" id="copy">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="square" aria-hidden="true"><path d="M12 3v12M7.5 7.5 12 3l4.5 4.5"/><path d="M5 12v8h14v-8"/></svg>
    <span>Copy link</span>
  </button>
  <button class="sp-sharebar__btn" type="button">WhatsApp</button>
  <button class="sp-sharebar__btn" type="button">Viber</button>
  <button class="sp-sharebar__btn" type="button">Email</button>
  <span class="sp-sharebar__url">sipa.example/p/PTN-MT-26-0142</span>
</div>
<script>
  document.getElementById('copy').addEventListener('click', function () {
    var label = this.querySelector('span');
    var done = function () { label.textContent = 'Link copied'; setTimeout(function () { label.textContent = 'Copy link'; }, 1600); };
    try { navigator.clipboard.writeText('https://sipa.example/p/PTN-MT-26-0142').then(done, done); } catch (e) { done(); }
  });
</script>
</body>
</html>
