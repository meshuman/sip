# Sīpa: site-wide copy. Every reusable string lives here.
# {curly} = filled from data. {{TODO: …}} = Sīpa must supply.

brand:
  name: Sīpa
  nameNe: सीप
  meaning: Skill, the kind that lives in the hands.
  tagline: Made by hand in Nepal. Recorded for life.
  originLine: From the land of the Buddha's birth.
  baseUrl: "https://sipa.example   # {{TODO: final domain}}"

seo:
  titleTemplate: "{page} · Sīpa"
  defaultDescription: Statues, thangkas and Mithila paintings from named makers across Nepal, each with its maker's story, a care kit and a registry number.
  defaultShareImage: /design-system/assets/Share/og-default.png

header:
  logoAlt: Sīpa, सीप, home
  primary:
    - { label: Rooms, href: /rooms }
    - { label: Makers, href: /makers }
    - { label: Places, href: /places }
    - label: Learn
      panel:
        - heading: Crafts
          href: /crafts
          line: How each piece is made, and how to recognise good work.
        - heading: Meaning
          href: /meaning
          line: What the figures, gestures and motifs signify.
        - heading: Care
          href: /care
          line: How to look after wood, metal, stone, cloth and paper.
    - { label: Journal, href: /journal }
  utility:
    search: Search
    registry: Registry
    registryTitle: Check a registry number
    account: Account
    signIn: Sign in
    bag: Bag
    bagCount: "Bag, {count} pieces"
    bagCountOne: Bag, 1 piece
    language: English
    languageNe: नेपाली
  menuOpen: Menu
  menuClose: Close
  skipLink: Skip to content

footer:
  tagline: Made by hand in Nepal. Recorded for life.
  columns:
    - heading: Sīpa
      links:
        - { label: Our promise, href: /about }
        - { label: How we work, href: /about/how-we-work }
        - { label: Visit a workshop, href: /visit, phase: phase-2 }
        - { label: For designers and hotels, href: /trade, phase: phase-3 }
    - heading: Help
      links:
        - { label: Shipping, href: /help/shipping }
        - { label: Returns, href: /help/returns }
        - { label: Export and customs, href: /help/export-and-customs }
        - { label: Payments, href: /help/payments }
        - { label: Questions, href: /help/faq }
        - { label: Contact, href: /contact }
    - heading: Owners
      links:
        - { label: Care guides, href: /care }
        - { label: Check a registry number, href: /registry }
        - { label: Your collection, href: /account/collection }
  legal:
    - { label: Terms, href: /legal/terms }
    - { label: Privacy, href: /legal/privacy }
    - { label: Cookies, href: /legal/cookies }
  company: "{{TODO: registered company name}}, Lalitpur, Nepal"
  copyright: "© {year} {{TODO: registered company name}}"
  currencyLabel: Prices in
  languageLabel: Language

breadcrumbs:
  home: Home
  label: Breadcrumb

currency:
  options:
    - { code: NPR, label: Nepali rupee, symbol: "₹" }
    - { code: USD, label: US dollar, symbol: "$" }
    - { code: EUR, label: Euro, symbol: "€" }
  note: Prices are set in Nepali rupees. Other currencies are shown at today's rate and charged in the currency you see at checkout.

