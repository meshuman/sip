<!-- Sīpa design system · Hotspot preview. Open in a browser. -->
<!doctype html>
<html>
<head><meta name="viewport" content="width=device-width, initial-scale=1"><script>(function(){var m=location.search.match(/theme=(light|dark)/);if(m)document.documentElement.setAttribute("data-theme",m[1]);})();</script><link rel="stylesheet" href="../../tokens.css"><link rel="stylesheet" href="../bundle.css"><meta charset="utf-8"><title>3D hotspot</title></head>
<body class="sp" style="margin:0;padding:24px">
<div class="sp-stage" role="group" aria-label="3D view of Shakyamuni, earth-touching">
  <svg class="sp-stage__model" viewBox="0 0 400 300" preserveAspectRatio="xMidYMax meet" aria-hidden="true">
    <circle class="halo" cx="200" cy="92" r="72"></circle>
    <circle class="form" cx="200" cy="52" r="9"></circle>
    <ellipse class="form" cx="200" cy="86" rx="23" ry="28"></ellipse>
    <path class="form" d="M200 114c-30 2-46 16-49 40l-8 74h114l-8-74c-3-24-19-38-49-40Z"></path>
    <path class="form" d="M128 270c3-32 36-44 72-44s69 12 72 44Z"></path>
    <path class="base" d="M116 270h168v24H116Z"></path>
  </svg>
  <div class="sp-hot" style="left:50%;top:21%"><button class="sp-hot__dot" type="button" aria-expanded="false" aria-label="1, Ushnisha">1</button></div>
  <div class="sp-hot sp-hot--open sp-hot--left" style="left:40%;top:72%">
    <button class="sp-hot__dot" type="button" aria-expanded="true" aria-label="2, Earth-touching hand">2</button>
    <div class="sp-hot__card"><b>Earth-touching hand</b><span>Carved in wax, <span class="sp-reg-s" style="display:inline">days 9–19</span></span></div>
  </div>
  <div class="sp-hot" style="left:60%;top:91%"><button class="sp-hot__dot" type="button" aria-expanded="false" aria-label="3, Double lotus base">3</button></div>
  <span class="sp-stage__hint sp-reg-s">Drag to turn · 360°</span>
</div>
<ol class="sp-hotlist">
  <li><div><b>Ushnisha</b><span>The crown of wisdom, gilded last</span></div></li>
  <li><div><b>Earth-touching hand</b><span>Calls the earth to witness the awakening</span></div></li>
  <li><div><b>Double lotus base</b><span>Cast separately, sealed with prayers inside</span></div></li>
</ol>
</body>
</html>
