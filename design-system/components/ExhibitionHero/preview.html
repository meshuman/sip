<!doctype html>
<html>
<head><meta name="viewport" content="width=device-width, initial-scale=1"><script>(function(){var m=location.search.match(/theme=(light|dark)/);if(m)document.documentElement.setAttribute("data-theme",m[1]);})();</script><link rel="stylesheet" href="../../tokens.css"><link rel="stylesheet" href="../bundle.css"><meta charset="utf-8"><title>Exhibition hero</title></head>
<body class="sp" style="margin:0;padding:24px">
<section class="sp-hero">
  <figure class="sp-hero__plate" style="margin:0">
    <svg viewBox="0 0 400 500" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
      <circle cx="200" cy="170" r="92" style="fill:none;stroke:var(--gilt)" stroke-width="1.5"></circle>
      <circle cx="200" cy="120" r="11" style="fill:var(--line)"></circle>
      <ellipse cx="200" cy="160" rx="29" ry="35" style="fill:var(--line)"></ellipse>
      <path d="M200 196c-38 2-58 20-62 50l-10 92h144l-10-92c-4-30-24-48-62-50Z" style="fill:var(--line)"></path>
      <path d="M110 392c4-40 46-56 90-56s86 16 90 56Z" style="fill:var(--line)"></path>
      <path d="M96 392h208v26H96Z" style="fill:var(--stone)" opacity=".45"></path>
    </svg>
    <figcaption class="sp-hero__caption sp-reg-s">Day 38 · after gilding · daylight from the east window</figcaption>
  </figure>
  <div class="sp-hero__text">
    <div class="sp-hero__room"><span class="sp-label">Room 1 · Metal from Patan</span><span class="sp-label">Piece 3 of 12</span></div>
    <h1>Shakyamuni, <span class="sp-nb">earth-touching</span></h1>
    <p class="sp-hero__maker">Made by <b>Raju Shakya</b> in Nagbahal, Patan, over 38 days.</p>
    <p class="sp-hero__lead">Cast in copper by the lost-wax method, then fire-gilded over four days. The right hand calls the earth to witness.</p>
    <div class="sp-hero__act">
      <div class="sp-seal">
        <div class="sp-seal__ring" aria-hidden="true"><span>स</span></div>
        <div class="sp-seal__text"><span class="sp-reg">SĪPA · PTN-MT-26-0142</span><small>One of one · awaiting its first owner</small></div>
      </div>
      <div class="sp-row">
        <button class="sp-btn" type="button">Make it yours <span class="sp-btn__price">₹96,000</span></button>
        <button class="sp-btn sp-btn--quiet" type="button">Watch the making</button>
      </div>
    </div>
  </div>
</section>
</body>
</html>
